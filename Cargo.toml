[workspace]
resolver = "2"
members = ["core", "platform", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.79"
license = "MIT"
authors = ["LAN Chat contributors"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "net",
    "sync",
    "time",
    "io-util",
    "fs",
] }
thiserror = "2"
tracing = "0.1"
base64 = "0.22"
sha2 = "0.10"
rand = "0.8"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
panic = "abort"
